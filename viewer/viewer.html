<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HueGist PDF Reader</title>
  <link rel="stylesheet" href="viewer.css">
  <script src="pdf.min.js"></script>
</head>
<body class="dark-theme">
  <!-- Top Navigation Toolbar -->
  <header class="viewer-navbar">
    <div class="nav-left">
      <img src="../icons/icon-32.png" alt="HueGist" class="nav-logo">
      <div class="nav-title-group">
        <span class="nav-brand">HueGist</span>
        <span class="nav-doc-name" id="doc-name">No PDF Loaded</span>
      </div>
    </div>

    <!-- Page Controls -->
    <div class="nav-center">
      <button id="prev-page-btn" class="nav-btn" title="Previous Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="page-indicator">
        <span id="page-num">0</span> / <span id="page-count">0</span>
      </div>
      <button id="next-page-btn" class="nav-btn" title="Next Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- Zoom Controls -->
      <button id="zoom-out-btn" class="nav-btn" title="Zoom Out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <span id="zoom-level" class="zoom-text">100%</span>
      <button id="zoom-in-btn" class="nav-btn" title="Zoom In">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
    </div>

    <!-- Actions -->
    <div class="nav-right">
      <label for="file-input" class="open-file-btn" title="Open local PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Open PDF</span>
      </label>
      <input type="file" id="file-input" accept="application/pdf" style="display: none;" />

      <button id="open-companion-btn" class="nav-accent-btn" title="Open HueGist Side Panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span>Companion</span>
      </button>
    </div>
  </header>

  <!-- PDF Document Canvas Viewport -->
  <main class="viewer-viewport" id="viewport">
    <div class="drop-zone" id="drop-zone">
      <div class="drop-box">
        <div class="drop-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h2>Open or Drop a PDF Document</h2>
        <p>Select any text while reading to extract and organize highlights.</p>
        <button id="choose-file-btn" class="select-file-btn">Choose PDF File</button>
      </div>
    </div>

    <div class="pages-container" id="pages-container" style="display: none;">
      <!-- Active PDF Page Canvas and Text Layer are rendered here -->
      <div class="page-wrapper" id="page-wrapper">
        <canvas id="pdf-canvas"></canvas>
        <div class="text-layer" id="text-layer"></div>
      </div>
    </div>
  </main>

  <!-- Floating Highlighter Toolbar (Inside Viewer) -->
  <div class="viewer-highlight-bar" id="viewer-toolbar">
    <button class="color-btn" style="background-color: #fde047;" data-color="yellow" title="Key Concept"></button>
    <button class="color-btn" style="background-color: #86efac;" data-color="green" title="Fact / Evidence"></button>
    <button class="color-btn" style="background-color: #7dd3fc;" data-color="blue" title="Definition"></button>
    <button class="color-btn" style="background-color: #f472b6;" data-color="pink" title="Important / Review"></button>
    <button class="color-btn" style="background-color: #c084fc;" data-color="purple" title="Quote / Notable"></button>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
